services:
  juice-shop:
    image: bkimminich/juice-shop
    restart: unless-stopped
    networks:
      hackerlab-net:
        ipv4_address: 172.29.250.10

  hackerlab:
    build: .
    stdin_open: true
    tty: true
    depends_on:
      - juice-shop
    networks:
      - hackerlab-net
    command: ["bash"]

networks:
  hackerlab-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.250.0/24
